[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pathviz"
dynamic = ["version"]
description = "Maze generation, pathfinding and visualisation connected only by a plain adjacency list"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matej Jelisavac", email = "matej.jelisavac@gmail.com" }]
keywords = ["pathfinding", "astar", "dijkstra", "maze", "visualisation"]
classifiers = [
	"Programming Language :: Python :: 3",
	"Operating System :: OS Independent",
	"Topic :: Scientific/Engineering :: Visualization",
	"Intended Audience :: Education",
]

dependencies = ["pygame>=2.6"]

[project.urls]
Source = "https://github.com/matejjelisavac/PathfindingVisualizer"
Issues = "https://github.com/matejjelisavac/PathfindingVisualizer/issues"

[tool.hatch.version]
path = "src/pathviz/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pathviz"]
